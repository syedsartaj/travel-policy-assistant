<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel policy assistant</title>
    <style>
      :root {
        --ink: #1a1d21;
        --muted: #6b7280;
        --line: #e4e7eb;
        --bg: #f7f8fa;
        --card: #ffffff;
        --green: #0f7b46;
        --amber: #9a6700;
        --grey: #57606a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 48px 20px 80px;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main { max-width: 680px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
      .sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
      form { display: flex; gap: 8px; }
      input {
        flex: 1; padding: 13px 15px; font-size: 16px; font-family: inherit;
        border: 1px solid var(--line); border-radius: 10px; background: var(--card);
      }
      input:focus { outline: 2px solid #2563eb; outline-offset: -1px; border-color: transparent; }
      button {
        padding: 13px 20px; font-size: 15px; font-family: inherit; font-weight: 500;
        border: 0; border-radius: 10px; background: var(--ink); color: #fff; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .examples { margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 7px; }
      .examples button {
        background: transparent; color: var(--muted); border: 1px solid var(--line);
        padding: 6px 11px; font-size: 13px; font-weight: 400; border-radius: 999px;
      }
      .examples button:hover { color: var(--ink); border-color: #c9ced6; }
      .answer {
        margin-top: 26px; background: var(--card); border: 1px solid var(--line);
        border-radius: 12px; padding: 20px 22px;
      }
      .badge {
        display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
        text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
        border: 1px solid currentColor; margin-bottom: 12px;
      }
      .covered { color: #0f7b46; }
      .not_covered { color: var(--amber); }
      .out_of_scope { color: var(--grey); }
      .text { white-space: pre-wrap; margin: 0; }
      .source {
        margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line);
        color: var(--muted); font-size: 13px;
      }
      footer { margin-top: 34px; color: var(--muted); font-size: 13px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Travel policy assistant</h1>
      <p class="sub">Ask about the travel-expense policy. It answers from the policy file, and says so when the policy does not cover the question.</p>

      <form id="form">
        <input id="q" placeholder="Can I expense a $95 dinner in Dubai?" autocomplete="off" autofocus />
        <button type="submit" id="go">Ask</button>
      </form>

      <div class="examples" id="examples"></div>
      <div id="out"></div>

      <footer id="footer"></footer>
    </main>

    <script>
      const EXAMPLES = [
        'Can I expense a $95 dinner in Dubai?',
        'Is a 3 night hotel stay in London at $700 within policy?',
        'Can I fly business class on an 8 hour flight?',
        'Can I claim a taxi in India?',
        'What is the meal limit in Germany?',
        'Can I claim £60 for lunch in London?',
        'How much can I spend in Dubai?',
        'What is the capital of France?',
      ];

      const form = document.getElementById('form');
      const input = document.getElementById('q');
      const go = document.getElementById('go');
      const out = document.getElementById('out');

      const chips = document.getElementById('examples');
      for (const example of EXAMPLES) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.textContent = example;
        chip.onclick = () => { input.value = example; ask(); };
        chips.append(chip);
      }

      const LABEL = { covered: 'Covered', not_covered: 'Not covered', out_of_scope: 'Out of scope' };

      async function ask() {
        const question = input.value.trim();
        if (!question) return;

        go.disabled = true;
        go.textContent = '…';
        try {
          const response = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ question }),
          });
          render(await response.json());
        } catch (error) {
          out.innerHTML = '<div class="answer"><p class="text"></p></div>';
          out.querySelector('.text').textContent = String(error);
        } finally {
          go.disabled = false;
          go.textContent = 'Ask';
        }
      }

      function render(answer) {
        const card = document.createElement('div');
        card.className = 'answer';

        const badge = document.createElement('span');
        badge.className = 'badge ' + answer.coverage;
        badge.textContent = LABEL[answer.coverage] ?? answer.coverage;

        const text = document.createElement('p');
        text.className = 'text';
        text.textContent = answer.text;

        card.append(badge, text);

        const source = document.createElement('p');
        source.className = 'source';
        source.textContent = answer.citations.length
          ? 'Source: ' + answer.citations.map((c) => c.category + ' / ' + c.region + ' (line ' + c.lines.join(', ') + ')').join('; ')
          : 'No rule in the policy matched.';
        card.append(source);

        out.replaceChildren(card);
      }

      form.onsubmit = (event) => { event.preventDefault(); ask(); };

      fetch('/api/policy').then((r) => r.json()).then((policy) => {
        document.getElementById('footer').textContent =
          policy.rules.length + ' rules loaded from ' + policy.source + ' · answered by the ' + policy.provider + ' model';
      });
    </script>
  </body>
</html>
